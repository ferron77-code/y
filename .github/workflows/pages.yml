name: Deploy to GitHub Pages

# A free staging URL that has no build credits to run out of. Hostinger stays
# the production home; this is so the site can always be reviewed.
# The github-pages environment trusts the default branch, so master is the
# branch that actually deploys; the feature branch stays here so work in
# progress still gets built and type-checked.
on:
  push:
    branches: [master, claude/cuba-b459-cinematic-site-1nw0cu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pages serves from /<repo>/, so the bundle and every runtime asset url
      # has to be built against that prefix.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
